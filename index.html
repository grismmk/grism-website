 const m=MOTD[Math.floor(Date.now()/864e5)%MOTD.length];
 const d=document.createElement('div');d.className='res motd';
 const h=document.createElement('div');h.className='hd';h.textContent='📅 MEME OF THE DAY · '+new Date().toLocaleDateString([],{day:'numeric',month:'short'});
 const t=document.createElement('h3');t.textContent=m[2];const p=document.createElement('div');p.textContent=m[3];p.style.fontSize='14px';
 d.append(h,t,p,gif(m[0],m[1]));chat.appendChild(d);
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const down=()=>{chat.scrollTop=chat.scrollHeight};

function gif(key,cap){
 if(!R[key])key=RK[Math.floor(Math.random()*RK.length)];const r=R[key];setTimeout(()=>play(key),200);
 const d=document.createElement('div');d.className='gif';d.style.background=`linear-gradient(135deg,${r[2]},${r[3]})`;
 const sp=[...r[4]];
 const spots=[["8%","30%"],["82%","25%"],["15%","62%"],["78%","58%"]];
 sp.slice(0,4).forEach((c,i)=>{const s=document.createElement('span');s.className='sp';s.textContent=c;s.style.left=spots[i][0];s.style.top=spots[i][1];s.style.animationDelay=(i*.4)+'s';d.appendChild(s)});
 const tag=document.createElement('div');tag.className='tag';tag.textContent='🎞️ MEMEBAJE GIF';d.appendChild(tag);
 const e=document.createElement('div');e.className='em';e.textContent=r[0];e.style.animation=`${r[1]} 1.1s ease-in-out infinite`;d.appendChild(e);
 const c=document.createElement('div');c.className='cap';c.textContent=cap||CAPS[Math.floor(Math.random()*CAPS.length)];d.appendChild(c);
 return d;
}
function add(t,cls){const d=document.createElement('div');d.className='m '+cls;d.textContent=t;chat.appendChild(d);down();return d}
function typing(){const d=document.createElement('div');d.className='m bot dots';d.innerHTML='<span></span><span></span><span></span>';chat.appendChild(d);down();return d}
function opts(list,fn){const d=document.createElement('div');d.className='opts';list.forEach(([t,v])=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{d.remove();fn(t,v)};d.appendChild(b)});chat.appendChild(d);down()}
async function bot(t,withGif){const d=typing();await sleep(450);d.classList.remove('dots');d.textContent=t;if(withGif)d.appendChild(gif(withGif));down()}

async function start(){
 motd();
 await bot("Namaste, sathi! 🙏 I'm MemeBaje — part Baburao, part tea-shop uncle, part WiFi that works only near the window.",'tea');
 await bot("Want to find out which meme YOU really are? Or just chat — I'll roast you gently like momo chutney.");
 opts([["🎯 Take the quiz",1],["💬 Just chat",2]],(t,v)=>{add(t,'me');v==1?quiz():chatMode()});
 showChips();
}
function chatMode(){bot("Ask me anything! Life advice, exam excuses, meme ideas, India vs Nepal debates... every answer comes with a reaction GIF. 😎",'cool')}
function showChips(){
 chips.innerHTML='';
 ["🔥 Latest memes","Roast me","Explain Kathmandu traffic","Best excuse for being late","Start the quiz"].forEach(t=>{const c=document.createElement('button');c.className='chip';c.textContent=t;c.onclick=()=>send(t);chips.appendChild(c)});
}
async function quiz(){qi=0;score={};await bot(`Rules: ${Q.length} questions, zero accuracy, 100% vibes. Go! 🚀`,'dance');ask()}
async function ask(){
 if(qi>=Q.length)return result();
 const q=Q[qi];
 await bot(`Q${qi+1}/${Q.length}: ${q.q}`);
 opts(q.a,(t,v)=>{add(t,'me');for(const k in v)score[k]=(score[k]||0)+v[k];qi++;ask()});
}
async function trending(){
 await bot(NE?"ताजा मिम, सीधै चुल्होबाट! 🔥":"Fresh memes, straight off the chulo! 🔥 (Memes die fast, so tell me if one is stale.)");
 const d=document.createElement('div');d.className='res';
 TREND.forEach(([e,n,t])=>{const r=document.createElement('div');r.style.margin='0 0 12px';const b=document.createElement('b');b.textContent=e+' '+n;const p=document.createElement('div');p.style.fontSize='14px';p.textContent=t;r.append(b,p);d.appendChild(r)});
 chat.appendChild(d);down();
 await bot("Tell me your situation and I'll match it to one of these. 😎",'fire');
}
async function share(txt){
 const full=txt+" "+location.href;
 try{if(navigator.share){await navigator.share({text:txt,url:location.href});return}}catch(e){}
 try{await navigator.clipboard.writeText(full);bot("Copied! Paste it in your group chat and start the fight. 📋",'clap');return}catch(e){}
 bot("Copy this and send it: "+full);
}
async function result(){
 await bot("Calculating your meme DNA… 🧬 (it's mostly chiya)");
 const ents=Object.keys(CH).map(k=>[k,score[k]||0]).sort((a,b)=>b[1]-a[1]);
 const tot=ents.reduce((s,e)=>s+e[1],0)||1,top=CH[ents[0][0]];
 const d=document.createElement('div');d.className='res';
 d.innerHTML=`<div class="big"></div><h2></h2><p style="text-align:center;margin:6px 0 14px"></p>`;
 d.querySelector('.big').textContent=top.e;d.querySelector('h2').textContent='You are '+top.n+'!';d.querySelector('p').textContent=top.d;
 ents.forEach(([k,v])=>{const p=Math.round(v/tot*100);const r=document.createElement('div');r.innerHTML=`<div class="row"><span>${CH[k].e} ${CH[k].n}</span><b>${p}%</b></div><div class="bar"><i style="width:${p}%"></i></div>`;d.appendChild(r)});
 chat.appendChild(d);down();
 hist.push({role:"assistant",content:`The user just took the quiz and got ${top.n}. Breakdown: ${ents.map(e=>CH[e[0]].n+" "+Math.round(e[1]/tot*100)+"%").join(", ")}.`});
 await bot("Screenshot and send to your group chat. Fight will start in 3… 2… 1… 🍿",'laugh');
 opts([["📤 Share result",3],["🔁 Retake",1],["💬 Roast my result",2]],(t,v)=>{add(t,'me');if(v==3)share("I'm "+top.n+" "+top.e+" on MemeBaje! Which meme are you?");else v==1?quiz():send("Roast my quiz result, I got "+top.n)});
}
const clean=t=>t.replace(/\[\[GIF:[^\]]*\]?\]?/gi,'').replace(/\[\[[^\]]*$/,'').trim();
async function send(t){
 t=t.trim();if(!t||busy)return;
 if(/^start the quiz$/i.test(t)){add(t,'me');return quiz()}
 if(/latest memes/i.test(t)){add(t,'me');return trending()}
 busy=true;inp.value='';add(t,'me');
 hist.push({role:"user",content:t});
 const d=typing();let out=null,key=null,cap=null;
 if(sample){
  try{
   const turns=hist.slice(-10).map(h=>({...h}));
   while(turns[0].role!=="user")turns.shift();
   turns[0].content=sysFor()+"\n\nConversation:\n"+turns[0].content;
   const r=await sample(turns,{cache:false,onText:({text})=>{d.classList.remove('dots');d.textContent=clean(text);down()}});
   const m=r.text.match(/\[\[GIF:\s*([a-z]+)\s*\|\s*([^\]]*)\]\]/i);
   if(m){key=m[1].toLowerCase();cap=m[2].trim()}
   out=clean(r.text);
   if(out){aiOK=true}
  }catch(e){out=null}
 }
 d.classList.remove('dots');
 if(!out){const L=NE?FALL_NE:FALL;out=L[Math.floor(Math.random()*L.length)]}
 d.textContent=out;d.appendChild(gif(key,cap));
 hist.push({role:"assistant",content:out});
 busy=false;down();
 if(aiOK&&!aiTimer){freshNews();aiTimer=setInterval(freshNews,240000)}
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();send(inp.value)});
document.getElementById('snd').onclick=function(){snd=!snd;this.textContent=snd?'🔊':'🔇';if(snd){touched=true;play('clap')}};
document.getElementById('lang').onclick=function(){NE=!NE;this.textContent=NE?'English':'नेपाली';inp.placeholder=NE?'बाजेलाई केही भन्नुस्…':'Say something to Baje…';bot(NE?"ठीक छ सथी! अब देखि नेपालीमै गफ गर्छु। 🇳🇵":"Back to English, sathi! 🌍",NE?'tea':'cool')};

/* ---- funny news ---- */
let pool=[...NEWS].sort(()=>Math.random()-.5),shown=[],aiTimer=null;
const clock=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
function renderNews(){
 newsEl.innerHTML='';
 shown.forEach(n=>{const d=document.createElement('div');d.className='n';const b=document.createElement('b');b.textContent=n.h;const s=document.createElement('small');s.textContent=(n.ai?'🤖 ':'📰 ')+n.t+' · Baje Times';d.append(b,s);newsEl.appendChild(d)});
 document.getElementById('upd').textContent='Updated '+clock();
}
function pushNews(){
 if(!pool.length)pool=[...NEWS].sort(()=>Math.random()-.5);
 const n=pool.shift();shown.unshift(typeof n==='string'?{h:n,t:clock()}:{h:n.h,t:clock(),ai:true});
 shown=shown.slice(0,6);renderNews();
}
async function freshNews(){
 if(!sample)return;
 try{
  const r=await sample.json("Write 6 short, absurd satirical news headlines (max 14 words each) about everyday life in Nepal and South Asia: Kathmandu traffic, load-shedding, momo, chiya, cricket, group chats, exams, Nepali time, and current internet memes. Light, kind humor. No real people, politicians, religion, caste or ethnicity jokes. Return ONLY a JSON array of 6 strings.",{cache:false});
  if(Array.isArray(r))pool.unshift(...r.filter(x=>typeof x==='string').map(h=>({h})));
  pushNews();
 }catch(e){}
}
for(let i=0;i<4;i++)pushNews();
setInterval(pushNews,9000);
document.getElementById('fresh').onclick=async()=>{if(sample&&!busy){await freshNews()}else pushNews()};
document.getElementById('side').addEventListener('click',e=>{if(innerWidth<=860&&e.target.id!=='fresh')document.getElementById('side').classList.toggle('open')});

start();
(async()=>{try{if(window.claude){sample=await claude.use("sample")}}catch(e){sample=null}})();
</script>
</body>
